<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPTALIVE - Elite Professional Football Analytics & Match Tracker</title>
    <meta name="description" content="Elite professional football analytics, match schedule, Opta telemetry, and live tracker." />
    <meta property="og:title" content="OPTALIVE - Elite Professional Football Analytics & Match Tracker" />
    <meta property="og:description" content="Elite professional football analytics, match schedule, Opta telemetry, and live tracker." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --primary-color: #39ff14;
        --primary-rgb: 57, 255, 20;
        --app-bg: #030712;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--app-bg);
        color: #f1f5f9;
        overflow-x: hidden;
      }
      .font-display {
        font-family: 'Oswald', sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      :focus-visible {
        outline: 2px solid var(--primary-color) !important;
        outline-offset: 2px !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#030712] min-h-screen text-slate-100 antialiased selection:bg-[var(--primary-color)] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
